<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しゅり直伝 暮らしの「撮り方」</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#E7EFDF; --ink:#4A3F35; --ivory:#F5EFE2; --sage:#A9C48A;
  --pink:#E4A4AC; --mustard:#E0B84C; --brick:#C6493B; --blue:#8FB0C4; --wood:#A9784E;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--mint)}
body{
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color:var(--ink); font-weight:500; line-height:1.7;
  max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:40px;
}
.page{padding:22px 20px 40px; animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{font-weight:900; line-height:1.4}
a{color:inherit;text-decoration:none}

/* ---- 共通パーツ ---- */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px;color:var(--ink)}
.card{background:var(--ivory);border:1.5px solid rgba(74,63,53,.12);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.tap{cursor:pointer;transition:transform .1s ease}
.tap:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:14px}
.chev{margin-left:auto;color:rgba(74,63,53,.35);font-weight:900}
.icon-circle{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  background:var(--ivory);border:1.5px solid rgba(74,63,53,.12);border-radius:999px;padding:7px 16px;margin-bottom:16px}
.small{font-size:12px;color:rgba(74,63,53,.6)}
.btn{display:block;text-align:center;font-family:inherit;font-size:15px;font-weight:900;color:var(--ink);
  background:var(--sage);border:none;border-radius:999px;padding:14px 22px;width:100%;cursor:pointer;margin-top:8px}
.btn.secondary{background:transparent;border:2px solid rgba(74,63,53,.25)}

/* ---- ホーム ---- */
.home-header{display:flex;align-items:center;gap:14px;margin:8px 0 22px}
.home-header .txt{flex:1}
.home-header .sub{font-size:13px;font-weight:700;color:rgba(74,63,53,.55)}
.home-header h1{font-size:29px}
.avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(74,63,53,.12);flex-shrink:0}

/* ---- カットビューア ---- */
.viewer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;
  margin:0 -20px;padding:0 20px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
.media{position:relative;border-radius:24px;overflow:hidden;background:#ddd;
  border:1.5px solid rgba(74,63,53,.12); aspect-ratio:4/5}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .badge{position:absolute;top:12px;left:12px;background:rgba(74,63,53,.75);color:#fff;
  font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px}
.media .loop{position:absolute;top:12px;right:12px;background:rgba(198,73,59,.9);color:#fff;
  font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px}
.slide h3{font-size:21px;margin:14px 0 4px}
.slide .angle{font-size:14px}
.tipbox{display:flex;gap:10px;align-items:flex-start;background:rgba(228,164,172,.18);
  border:1.5px solid rgba(228,164,172,.55);border-radius:18px;padding:12px 14px;margin-top:10px}
.tipbox img{width:44px;height:44px;object-fit:contain;flex-shrink:0}
.tipbox .label{font-size:10px;font-weight:900;color:var(--brick);letter-spacing:.08em}
.tipbox p{font-size:13px}
.nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.nav button{font-family:inherit;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(74,63,53,.18);
  background:var(--ivory);color:var(--ink);font-size:17px;font-weight:900;cursor:pointer}
.nav button:disabled{opacity:.3}
.dots{display:flex;gap:7px}
.dots span{width:8px;height:8px;border-radius:50%;background:rgba(74,63,53,.2);transition:all .2s}
.dots span.on{background:var(--sage);transform:scale(1.35)}

/* ---- 記事 ---- */
.article-title{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.article-title img{width:56px;height:56px;object-fit:contain;flex-shrink:0}
.article-body{white-space:pre-line;font-size:15px}
.pointcard{display:flex;gap:12px;align-items:flex-start;background:rgba(228,164,172,.16);
  border:1.5px solid rgba(228,164,172,.55);border-radius:20px;padding:16px;margin-top:14px}
.pointcard img{width:60px;height:60px;object-fit:contain;flex-shrink:0}
.pointcard .plabel{display:inline-block;font-size:11px;font-weight:900;color:var(--brick);
  background:rgba(198,73,59,.14);border-radius:999px;padding:3px 10px;margin-bottom:5px;letter-spacing:.08em}
.pointcard p{font-size:14px}

/* ---- 逆引き詳細 ---- */
.tiprow{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.tiprow .ic{width:24px;text-align:center;flex-shrink:0}
.tiprow .lbl{font-size:11px;color:rgba(74,63,53,.5);font-weight:700}
.tiprow .val{font-size:14px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= データ ================= */
const IMG = k => `assets/img/${k}.png`;

const ARTICLES = [
 {id:"light", title:"自然光を味方にする", point:"照明よりまず窓際！これだけで見え方が9割変わるよ〜",
  body:`いちばん手っ取り早く「映え」に近づくのは、実は照明を頑張ることじゃなくて窓際に立つこと。\nレースカーテン越しの光は柔らかくて、被写体の色をいちばん自然に見せてくれます。\n\n光が足りないと感じたら、白い紙や白い皿をレフ板がわりに置いてみて。\n影がふわっと和らいで、それだけでワンランク上の見え方になります。`},
 {id:"background", title:"背景を「すっきり」させる3つの方法", point:"迷ったら“1個どける”！引き算が正解だよ◎",
  body:`1. 主役の後ろに置くものを1〜2個までに絞る。\n2. 無地の布・木の板・アイボリーの紙を1枚敷くだけで生活感がぐっと減る。\n3. 撮る前に周りを軽く見渡して、視界に入る余計なものを画角の外に出す。\n\n「引き算」を意識するだけで、同じ商品・同じ部屋でも見違えます。`},
 {id:"hands", title:"手の入れ方で「生活感」を出す", point:"手がひとつ入るだけで、ぐっと“自分ごと”になるよ♪",
  body:`置き画だけだと綺麗だけど少し他人事に見えがち。\nそこに手が1つ入るだけで「自分でも使えそう」に変わります。\n\n爪や指先を意識してゆっくり動かす、手首のスナップを効かせすぎない。\nこの2つだけ意識すれば十分です。`},
 {id:"thumbnail", title:"サムネの黄金型：ピル型タグ＋大きな2行タイトル", point:"1画面に1メッセージ。欲張らないのがコツ！",
  body:`サムネの型はシンプル。\n上にピル型の一言タグ、下に大きめの2行タイトル。情報は詰め込みすぎない。\n\n1画面1メッセージを守るだけで、スクロールする指が止まりやすくなります。`},
 {id:"cuts", title:"リールの黄金カット割（掴み3秒→変化→結論）", point:"掴みの3秒がすべて。最初に“予告”してあげて◎",
  body:`最初の3秒で「なにが起きるか」を予告する。\n真ん中で変化（開ける・塗る・比べる）を見せる。\n最後に結論（仕上がり・答え）で締める。\n\nこの3段構成に沿ってカットを並べるだけで、離脱しにくいリールになります。`},
 {id:"colors", title:"世界観は「色を3つに絞る」", point:"色は3つまで。それだけで“世界観”が出るよ〜",
  body:`背景・小物・服の色を、テーマカラー3色以内でまとめると統一感が出ます。\n色数が増えるほど「ごちゃっと」した印象になりやすいので注意。\n\n迷ったら、ベース1色＋差し色1色＋差し色を支える1色、くらいの配分がちょうどいい。`},
 {id:"phrases", title:"バズる切り口フレーズ集", point:"最初の一言に迷ったら、この中から選んでみて♪",
  body:`「この発想はなかった」「こっちが正解!?」「知らないと損してた」「これ1本で変わる」\n「〇〇な人だけ見て」「地味に神アイテム」\n\n冒頭のテロップや台本の掴みに、こうしたフレーズを添えるだけで最初の3秒の離脱が減ります。`},
];

const SECTIONS = [
 {id:"scene", title:"使用シーンを分解", subtitle:"「椅子に座る」を4カットで", emoji:"🪑", sample:true, cuts:[
   {title:"椅子を引く", angle:"少し引きで、部屋の空気ごと写す", tip:"「これから使う」の予感を1カット目に", media:{v:"assets/video/cut1.mp4"}},
   {title:"背もたれに手を添える", angle:"手元にぐっと寄って", tip:"手のアップで動作の始まりを見せる", media:{v:"assets/video/cut2.mp4"}},
   {title:"腰を下ろす", angle:"横から、動きの瞬間を", tip:"座る瞬間が主役。動きは最後まで見られやすい", media:{v:"assets/video/cut3.mp4"}},
   {title:"座って一息", angle:"座った姿に寄って余韻を", tip:"落ち着いた表情で締めると「暮らし」が伝わる", media:{v:"assets/video/cut4.mp4"}},
 ]},
 {id:"unbox", title:"開封", subtitle:"箱を開けるワクワクを見せる", emoji:"📦", cuts:[
   {title:"箱ヒーロー", angle:"正面から、目線の高さで", tip:"冒頭1秒で「何を開けるか」を伝える", media:{i:IMG("unbox_box_hero")}},
   {title:"開ける瞬間", angle:"斜め上から、手ごと入れて", tip:"開封の瞬間は続きが気になる引きになる", media:{i:IMG("unbox_opening")}},
   {title:"中身を並べる", angle:"真上から俯瞰で", tip:"全体像が一目でわかると安心感が出る", media:{i:IMG("unbox_contents_flatlay")}},
 ]},
 {id:"spec", title:"仕様・ディテール", subtitle:"質感と作り込みを伝える", emoji:"🔍", cuts:[
   {title:"全体像", angle:"正面から、背景はすっきりさせて", tip:"主役をまず1枚で見せ切る", media:{i:IMG("spec_overview")}},
   {title:"質感の寄り", angle:"斜め横からの光で、グッとマクロ", tip:"質感アップは指を止めさせる", media:{i:IMG("spec_texture_macro")}},
   {title:"気になる部分", angle:"特徴的なパーツに部分アップ", tip:"細部のこだわりが伝わると信頼感が増す", media:{i:IMG("spec_detail")}},
   {title:"手でサイズ感", angle:"手のひらに乗せて", tip:"実際の大きさが一番伝わるカット", media:{i:IMG("spec_inhand")}},
 ]},
 {id:"lifestyle", title:"それがある暮らし", subtitle:"生活になじむ空気感を見せる", emoji:"🏠", cuts:[
   {title:"置いた部屋の引き", angle:"窓際の自然光で少し引いて", tip:"世界観が伝わると保存されやすい", media:{i:IMG("lifestyle_room_wide")}},
   {title:"使う手元", angle:"動作中の手元に寄って", tip:"人の動きが入ると「自分ごと」になる", media:{i:IMG("lifestyle_using")}},
   {title:"余韻の寄り", angle:"斜めから、背景は軽くボケさせて", tip:"最後の一枚が投稿の余韻を決める", media:{i:IMG("lifestyle_afterglow")}},
 ]},
 {id:"beforeafter", title:"ビフォーアフター", subtitle:"変化の説得力で魅せる", emoji:"✨", cuts:[
   {title:"ビフォー", angle:"正面から、変化前の状態を", tip:"ビフォーが弱いとアフターも弱く見える", media:{i:IMG("beforeafter_before")}},
   {title:"作業中", angle:"手元に寄って、変化の途中を", tip:"変化が起きる瞬間は最後まで見られやすい", media:{i:IMG("beforeafter_working")}},
   {title:"アフター", angle:"ビフォーと同じ構図・同じ距離で", tip:"同じ構図で撮ると変化が一目でわかる", media:{i:IMG("beforeafter_after")}},
 ]},
 {id:"size", title:"サイズ・比較", subtitle:"大きさの実感を伝える", emoji:"📏", cuts:[
   {title:"定番品と並べる", angle:"見慣れたものを隣に置いて正面から", tip:"身近な比較対象があるとサイズ感が一瞬で伝わる", media:{i:IMG("size_compare_item")}},
   {title:"手のひらに乗せる", angle:"手のひらに乗せて正面から", tip:"手に乗せるだけで実寸がわかる", media:{i:IMG("size_palm")}},
   {title:"収納に入れる", angle:"しまう動作を斜め上から", tip:"収まる様子は「使えそう」を後押しする", media:{i:IMG("size_storage")}},
 ]},
 {id:"howto", title:"使い方ステップ", subtitle:"手順を追って理解させる", emoji:"🔢", cuts:[
   {title:"STEP1", angle:"手元に寄って、最初の動作を", tip:"STEPごとに区切ると迷わず真似できる", media:{i:IMG("howto_step1")}},
   {title:"STEP2", angle:"手元に寄って、次の動作を", tip:"同じアングルで揃えるとテンポが生まれる", media:{i:IMG("howto_step2")}},
   {title:"STEP3・仕上がり", angle:"真上俯瞰で、仕上がり全体を", tip:"完成形で締めると満足感が残る", media:{i:IMG("howto_step3")}},
 ]},
];

const DICT = [
 {id:"cosmetics", cat:"コスメ・スキンケア", light:"柔らかい自然光・逆光ぎみ", bg:"無地／大理石調", angle:"斜め45°＋真上", rec:["spec","lifestyle"]},
 {id:"food", cat:"食べ物・ドリンク", light:"自然光サイド", bg:"木／リネン", angle:"真上＋寄り", rec:["lifestyle","spec"]},
 {id:"gadget", cat:"ガジェット・家電", light:"均一・影控えめ", bg:"グレー／白", angle:"正面＋ディテール", rec:["unbox","spec"]},
 {id:"fashion", cat:"服・ファッション小物", light:"自然光", bg:"白壁／床置き", angle:"真上フラットレイ", rec:["lifestyle","size"]},
 {id:"interior", cat:"インテリア雑貨", light:"窓際自然光", bg:"実際の部屋", angle:"引き＋寄り", rec:["lifestyle","beforeafter"]},
 {id:"kitchen", cat:"キッチン・食器", light:"自然光", bg:"木／タイル", angle:"真上＋斜め", rec:["howto","lifestyle"]},
 {id:"baby", cat:"おもちゃ・ベビー", light:"明るい自然光", bg:"無地明るい", angle:"目線＋俯瞰", rec:["unbox","lifestyle"]},
 {id:"book", cat:"本・文具", light:"柔らかい光", bg:"無地／木", angle:"真上フラットレイ", rec:["spec","size"]},
];

/* ================= ルーティング ================= */
const app = document.getElementById("app");
function route(){
  const h = location.hash.replace(/^#\/?/, "");
  const [p, arg] = h.split("/");
  window.scrollTo(0,0);
  if(p==="textbook") return renderTextbook();
  if(p==="article") return renderArticle(arg);
  if(p==="dict") return arg ? renderDictDetail(arg) : renderDict();
  if(p==="guide") return renderGuide();
  if(p==="cuts") return renderCuts(arg);
  renderHome();
}
window.addEventListener("hashchange", route);

const esc = s => s.replace(/</g,"&lt;");
const back = (href, label) => `<a class="back tap" href="${href}">← ${label}</a>`;

/* ================= 各ページ ================= */
function renderHome(){
  app.innerHTML = `<div class="page">
    <div class="home-header">
      <div class="txt">
        <div class="sub">しゅり直伝</div>
        <h1>暮らしの<br>「撮り方」</h1>
      </div>
      <img class="avatar" src="assets/img/shuri_avatar.png" alt="しゅり">
    </div>
    ${pillar("#/textbook","📖","暮らしを撮る教科書","撮り方のコツを学ぶ","rgba(143,176,196,.5)")}
    ${pillar("#/dict","🔎","撮り方逆引き辞典","なにを撮る？から調べる","rgba(228,164,172,.5)")}
    ${pillar("#/guide","🎬","撮影カットガイド","カットごとの撮り方を見る","rgba(169,196,138,.55)")}
    <div class="card">
      <h3 style="font-size:16px">はじめてでも大丈夫</h3>
      <p class="small" style="margin-top:4px">教科書で学ぶ → 逆引きで調べる → カットガイドの順に見ると迷いません。</p>
      <a href="#/textbook"><button class="btn" style="background:var(--blue)">教科書からはじめる</button></a>
    </div>
  </div>`;
}
function pillar(href, emoji, title, sub, color){
  return `<a href="${href}"><div class="card tap row">
    <div class="icon-circle" style="background:${color}">${emoji}</div>
    <div><div style="font-weight:900;font-size:17px">${title}</div>
    <div class="small">${sub}</div></div>
    <div class="chev">›</div>
  </div></a>`;
}

function renderTextbook(){
  app.innerHTML = `<div class="page">
    ${back("#/","トップ")}
    <span class="pill" style="background:rgba(143,176,196,.4)">教科書</span>
    <h2 style="font-size:24px;margin:6px 0 16px">暮らしを撮る教科書</h2>
    ${ARTICLES.map(a=>`<a href="#/article/${a.id}"><div class="card tap row">
      <div style="flex:1"><div style="font-weight:900;font-size:15px">${esc(a.title)}</div>
      <div class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.body.split("\n")[0])}</div></div>
      <div class="chev">›</div></div></a>`).join("")}
  </div>`;
}

function renderArticle(id){
  const a = ARTICLES.find(x=>x.id===id); if(!a) return renderTextbook();
  app.innerHTML = `<div class="page">
    ${back("#/textbook","教科書")}
    <div class="article-title">
      <img src="assets/img/shuri_happy.png" alt="">
      <div><span class="pill" style="background:rgba(143,176,196,.4)">しゅり直伝</span>
      <h2 style="font-size:21px;margin-top:4px">${esc(a.title)}</h2></div>
    </div>
    <div class="card article-body">${esc(a.body)}</div>
    <div class="pointcard">
      <img src="assets/img/shuri_point.png" alt="">
      <div><span class="plabel">POINT</span><p>${esc(a.point)}</p></div>
    </div>
  </div>`;
}

function renderDict(){
  app.innerHTML = `<div class="page">
    ${back("#/","トップ")}
    <span class="pill" style="background:rgba(228,164,172,.45)">逆引き</span>
    <h2 style="font-size:24px;margin:6px 0 16px">撮り方逆引き辞典</h2>
    ${DICT.map(d=>`<a href="#/dict/${d.id}"><div class="card tap row">
      <div style="font-weight:900;font-size:15px">${d.cat}</div>
      <div class="chev">›</div></div></a>`).join("")}
  </div>`;
}

function renderDictDetail(id){
  const d = DICT.find(x=>x.id===id); if(!d) return renderDict();
  app.innerHTML = `<div class="page">
    ${back("#/dict","逆引き辞典")}
    <h2 style="font-size:22px;margin-bottom:14px">${d.cat}</h2>
    <div class="card">
      <div class="tiprow"><div class="ic">☀️</div><div><div class="lbl">光</div><div class="val">${d.light}</div></div></div>
      <div class="tiprow"><div class="ic">🖼</div><div><div class="lbl">背景</div><div class="val">${d.bg}</div></div></div>
      <div class="tiprow"><div class="ic">📐</div><div><div class="lbl">角度</div><div class="val">${d.angle}</div></div></div>
    </div>
    <h3 style="font-size:16px;margin:16px 0 10px">おすすめの撮影構成</h3>
    ${d.rec.map(rid=>{const s=SECTIONS.find(x=>x.id===rid);return `<a href="#/cuts/${s.id}"><div class="card tap row">
      <div class="icon-circle" style="background:rgba(169,196,138,.45)">${s.emoji}</div>
      <div><div style="font-weight:900;font-size:15px">${s.title}</div>
      <div class="small">${s.cuts.length}カット・${s.subtitle}</div></div>
      <div class="chev">›</div></div></a>`;}).join("")}
  </div>`;
}

function renderGuide(){
  app.innerHTML = `<div class="page">
    ${back("#/","トップ")}
    <span class="pill" style="background:rgba(169,196,138,.5)">カットガイド</span>
    <h2 style="font-size:24px;margin:6px 0 4px">撮影カットガイド</h2>
    <p class="small" style="margin-bottom:16px">目的に合うセクションを選ぶと、カットごとの撮り方が見られます。</p>
    ${SECTIONS.map(s=>`<a href="#/cuts/${s.id}"><div class="card tap row">
      <div class="icon-circle" style="background:rgba(169,196,138,.45)">${s.emoji}</div>
      <div><div style="font-weight:900;font-size:16px">${s.title} ${s.sample?'<span class="pill" style="background:rgba(224,184,76,.45);font-size:10px">動画サンプル</span>':''}</div>
      <div class="small">${s.subtitle}・${s.cuts.length}カット</div></div>
      <div class="chev">›</div></div></a>`).join("")}
  </div>`;
}

/* ---- カットビューア ---- */
function renderCuts(id){
  const s = SECTIONS.find(x=>x.id===id); if(!s) return renderGuide();
  const N = s.cuts.length;
  app.innerHTML = `<div class="page">
    ${back("#/guide","セクション一覧")}
    <div class="viewer-head">
      <h2 style="font-size:20px">${s.title}</h2>
      <span class="pill" style="background:rgba(143,176,196,.4)" id="counter">CUT 1 / ${N}</span>
    </div>
    <div class="carousel" id="car">
      ${s.cuts.map((c,i)=>`<div class="slide" data-i="${i}">
        <div class="media">
          ${c.media.v
            ? `<video src="${c.media.v}" muted loop playsinline autoplay preload="auto"></video>
               <span class="loop">● ループ再生</span>`
            : `<img src="${c.media.i}" alt="">`}
          <span class="badge">CUT ${i+1}</span>
        </div>
        <h3>${i+1}. ${esc(c.title)}</h3>
        <div class="angle">${esc(c.angle)}</div>
        <div class="tipbox">
          <img src="assets/img/shuri_point.png" alt="">
          <div><div class="label">POINT</div><p>${esc(c.tip)}</p></div>
        </div>
      </div>`).join("")}
    </div>
    <div class="nav">
      <button id="prev" aria-label="前へ">‹</button>
      <div class="dots" id="dots">${s.cuts.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join("")}</div>
      <button id="next" aria-label="次へ">›</button>
    </div>
    <p class="small" style="text-align:center;margin-top:10px">← スワイプでカットを進められます →</p>
  </div>`;

  const car = document.getElementById("car");
  const dots = [...document.querySelectorAll("#dots span")];
  const counter = document.getElementById("counter");
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  let cur = 0;
  const update = i => {
    cur = Math.max(0, Math.min(N-1, i));
    dots.forEach((d,k)=>d.classList.toggle("on",k===cur));
    counter.textContent = `CUT ${cur+1} / ${N}`;
    prev.disabled = cur===0; next.disabled = cur===N-1;
    // 表示中の動画だけ再生（省電力）
    document.querySelectorAll("#car video").forEach((v,k)=>{ k===cur||!dots.length ? v.play().catch(()=>{}) : v.pause(); });
  };
  const goto = i => { car.scrollTo({left: i*car.clientWidth, behavior:"smooth"}); update(i); };
  prev.onclick = ()=>goto(cur-1);
  next.onclick = ()=>goto(cur+1);
  car.addEventListener("scroll", ()=>{
    const i = Math.round(car.scrollLeft / car.clientWidth);
    if(i!==cur) update(i);
  }, {passive:true});
  update(0);
}

route();
</script>
</body>
</html>
