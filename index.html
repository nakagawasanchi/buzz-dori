<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しゅり直伝 暮らしの「撮り方」</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#E7EFDF; --ink:#4A3F35; --ivory:#F5EFE2; --sage:#A9C48A;
  --pink:#E4A4AC; --mustard:#E0B84C; --brick:#C6493B; --blue:#8FB0C4; --wood:#A9784E;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#fff}
body{
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color:var(--ink); font-weight:500; line-height:1.7;
  max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:40px;
}
.page{padding:22px 20px 40px; animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{font-weight:900; line-height:1.4}
a{color:inherit;text-decoration:none}

/* ---- 共通パーツ ---- */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px;color:var(--ink)}
.card{background:var(--ivory);border:1.5px solid rgba(74,63,53,.12);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.tap{cursor:pointer;transition:transform .1s ease}
.tap:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1 1 0;min-width:0}
.chev{margin-left:auto;color:rgba(74,63,53,.35);font-weight:900;flex-shrink:0}
.icon-circle{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  background:var(--ivory);border:1.5px solid rgba(74,63,53,.12);border-radius:999px;padding:7px 16px;margin-bottom:16px}
.small{font-size:12px;color:rgba(74,63,53,.6)}
.btn{display:block;text-align:center;font-family:inherit;font-size:15px;font-weight:900;color:var(--ink);
  background:var(--sage);border:none;border-radius:999px;padding:14px 22px;width:100%;cursor:pointer;margin-top:8px}
.btn.secondary{background:transparent;border:2px solid rgba(74,63,53,.25)}

/* ---- ホーム ---- */
.home-header{display:flex;align-items:center;gap:14px;margin:8px 0 22px}
.home-header .txt{flex:1}
.home-header .sub{font-size:13px;font-weight:700;color:rgba(74,63,53,.55)}
.home-header h1{font-size:clamp(20px,6vw,26px);white-space:nowrap}
.avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(74,63,53,.12);flex-shrink:0}

/* ---- カットビューア ---- */
.viewer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;
  margin:0 -20px;padding:0 20px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always}
.media{position:relative;border-radius:24px;overflow:hidden;background:#ddd;
  border:1.5px solid rgba(74,63,53,.12); aspect-ratio:4/5}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
.media .badge{position:absolute;top:12px;left:12px;background:rgba(74,63,53,.75);color:#fff;
  font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px}
.media .loop{position:absolute;top:12px;right:12px;background:rgba(198,73,59,.9);color:#fff;
  font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px}
.swipe-arrow{position:absolute;top:50%;width:42px;height:42px;border-radius:50%;
  background:rgba(74,63,53,.32);color:rgba(255,255,255,.92);font-size:24px;font-weight:900;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  transform:translateY(-50%)}
.swipe-arrow.left{left:10px}
.swipe-arrow.right{right:10px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(-50%) translateX(0)}50%{transform:translateY(-50%) translateX(5px)}}
.slide h3{font-size:21px;margin:14px 0 4px}
.slide .angle{font-size:14px}
.tipbox{display:flex;gap:10px;align-items:flex-start;background:rgba(228,164,172,.18);
  border:1.5px solid rgba(228,164,172,.55);border-radius:18px;padding:12px 14px;margin-top:10px}
.tipbox img{width:44px;height:44px;object-fit:contain;flex-shrink:0}
.tipbox .label{font-size:10px;font-weight:900;color:var(--brick);letter-spacing:.08em}
.tipbox p{font-size:13px}
.nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
.nav button{font-family:inherit;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(74,63,53,.18);
  background:var(--ivory);color:var(--ink);font-size:17px;font-weight:900;cursor:pointer}
.nav button:disabled{opacity:.3}
.dots{display:flex;gap:7px}
.dots span{width:8px;height:8px;border-radius:50%;background:rgba(74,63,53,.2);transition:all .2s}
.dots span.on{background:var(--sage);transform:scale(1.35)}

/* ---- 完成イメージプレビュー ---- */
.pv-media{position:relative;border-radius:24px;overflow:hidden;background:#e8e4dc;
  border:1.5px solid rgba(74,63,53,.12);margin:14px auto 0}
.pv-media.v916{width:min(100%,330px);aspect-ratio:9/16}
.pv-media.v45{width:min(100%,400px);aspect-ratio:4/5}
.pv-media video,.pv-media img{width:100%;height:100%;object-fit:cover;display:block}
.cutlabel{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  background:rgba(74,63,53,.85);color:#fff;font-weight:900;font-size:15px;
  padding:8px 20px;border-radius:999px;white-space:nowrap;max-width:90%}
.pv-dots{display:flex;gap:7px;justify-content:center;margin-top:12px}
.pv-dots span{width:8px;height:8px;border-radius:50%;background:rgba(74,63,53,.2);transition:all .15s}
.pv-dots span.on{background:var(--sage);transform:scale(1.35)}

/* ---- 記事（ルーズリーフ調） ---- */
.notebook{position:relative;background:#fff;border:1.5px solid rgba(74,63,53,.16);border-radius:14px;
  padding:22px 20px 22px 52px;box-shadow:0 2px 10px rgba(74,63,53,.06)}
.notebook::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:1.5px;background:rgba(228,164,172,.75)}
.notebook::after{content:"";position:absolute;left:12px;top:26px;bottom:26px;width:14px;
  background-image:radial-gradient(circle at 7px 7px, #fff 4.5px, rgba(74,63,53,.22) 5px, rgba(74,63,53,.22) 6px, transparent 6.8px);
  background-size:14px 64px;background-repeat:repeat-y}
.notebook.ruled{background-image:repeating-linear-gradient(transparent,transparent 27px,rgba(143,176,196,.30) 27px,rgba(143,176,196,.30) 28px);
  background-origin:content-box;background-clip:content-box}
.notebook .article-body{line-height:28px;font-size:14.5px}
.note-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1.5px solid rgba(143,176,196,.35)}
.note-row:last-child{border-bottom:none}
.sashie-wrap{display:block;width:min(78%,300px);margin:4px auto 16px;position:relative;transform:rotate(-1.6deg)}
.sashie-wrap::before{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(2deg);
  width:88px;height:24px;background:rgba(224,184,76,.45);border-left:1px dashed rgba(255,255,255,.7);
  border-right:1px dashed rgba(255,255,255,.7);z-index:2}
.sashie-wrap img{width:100%;display:block;border:8px solid #fff;box-shadow:0 3px 12px rgba(74,63,53,.18)}
.lesson-num{width:34px;height:34px;border-radius:50%;background:rgba(143,176,196,.4);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0}
.pagenav-row{display:flex;gap:10px;margin-top:16px}
.pagenav{flex:1 1 0;min-width:0;background:var(--ivory);border:1.5px solid rgba(74,63,53,.12);
  border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pagenav.ghost{background:transparent;border:none}
.pagenav .dir{font-size:11px;font-weight:900;color:rgba(74,63,53,.55)}
.pagenav .t{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.article-title{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.article-title img{width:56px;height:56px;object-fit:contain;flex-shrink:0}
.article-body{white-space:pre-line;font-size:15px}
.pointcard{display:flex;gap:12px;align-items:flex-start;background:rgba(228,164,172,.16);
  border:1.5px solid rgba(228,164,172,.55);border-radius:20px;padding:16px;margin-top:14px}
.pointcard img{width:60px;height:60px;object-fit:contain;flex-shrink:0}
.pointcard .plabel{display:inline-block;font-size:11px;font-weight:900;color:var(--brick);
  background:rgba(198,73,59,.14);border-radius:999px;padding:3px 10px;margin-bottom:5px;letter-spacing:.08em}
.pointcard p{font-size:14px}

/* ---- 逆引き詳細 ---- */
.tiprow{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.tiprow .ic{width:24px;text-align:center;flex-shrink:0}
.tiprow .lbl{font-size:11px;color:rgba(74,63,53,.5);font-weight:700}
.tiprow .val{font-size:14px}

/* ---- 検索 ---- */
.searchbox{display:flex;align-items:center;gap:8px;background:var(--ivory);
  border:1.5px solid rgba(74,63,53,.16);border-radius:999px;padding:10px 16px;margin-bottom:18px}
.searchbox .ic{font-size:15px;flex-shrink:0;opacity:.6}
.searchbox input{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:14px;color:var(--ink)}
.searchbox input:focus{outline:none}
.searchbox input::placeholder{color:rgba(74,63,53,.4)}
.search-group{margin:22px 0 8px;font-size:13px;font-weight:900;color:rgba(74,63,53,.55);letter-spacing:.04em}
.search-empty{text-align:center;padding:36px 10px;color:rgba(74,63,53,.5);font-size:14px}

/* ---- タグ ---- */
.tags-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tagchip{display:inline-block;font-size:12px;font-weight:700;color:var(--ink);
  background:rgba(169,196,138,.28);border:1.5px solid rgba(169,196,138,.6);
  border-radius:999px;padding:5px 13px}

/* ---- 実写サンプル準備中バッジ ---- */
.media .draft,.pv-media .draft{position:absolute;top:12px;right:12px;background:rgba(224,184,76,.92);
  color:#fff;font-size:10px;font-weight:700;padding:4px 11px;border-radius:999px}

/* ---- しゅりさんメモ（レビュー用・ローンチ時に削除） ---- */
.fb-card{margin-top:26px;background:#FFF9F0;border:1.5px dashed rgba(224,184,76,.75);
  border-radius:20px;padding:16px}
.fb-head{font-weight:900;font-size:14px;margin-bottom:4px}
.fb-item{background:#fff;border:1.5px solid rgba(74,63,53,.12);border-radius:12px;
  padding:10px 12px;margin:8px 0;font-size:14px;white-space:pre-line;position:relative}
.fb-item .fb-date{font-size:10px;color:rgba(74,63,53,.45);margin-top:4px}
.fb-item .fb-del{position:absolute;top:6px;right:8px;border:none;background:none;
  color:rgba(74,63,53,.35);font-size:14px;cursor:pointer;padding:4px}
.fb-card textarea{width:100%;min-height:74px;border:1.5px solid rgba(74,63,53,.2);
  border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;
  background:#fff;margin-top:8px}
.fb-card textarea:focus{outline:none;border-color:var(--mustard)}
.fb-send{margin-top:8px;width:100%;border:none;border-radius:999px;padding:12px;
  font:inherit;font-weight:900;font-size:14px;background:var(--mustard);color:#fff;cursor:pointer}
.fb-send:disabled{opacity:.5}
.fb-status{font-size:12px;margin-top:6px;color:rgba(74,63,53,.55);text-align:center}
</style>
</head>
<body>
<div id="app"></div>

<script src="data/content.js"></script>
<script>
/* ================= データ(data/content.jsから読み込み。非公開はここで除外) ================= */
const ARTICLES = window.CONTENT.ARTICLES.filter(x=>x.published);
const SECTIONS = window.CONTENT.SECTIONS.filter(x=>x.published);
const DICT = window.CONTENT.DICT.filter(x=>x.published);

/* ================= 検索・タグ ================= */
const norm = s => (s||"").toLowerCase();
function searchAll(query){
  const q = norm(query);
  const hit = s => norm(s).includes(q);
  const hitTags = tags => (tags||[]).some(t=>hit(t));
  const articles = ARTICLES.filter(a => hit(a.title) || hit(a.body) || hit(a.point) || hitTags(a.tags));
  const sections = SECTIONS.filter(s => hit(s.title) || hit(s.subtitle) || hitTags(s.tags) ||
    s.cuts.some(c => hit(c.title) || hit(c.tip)));
  const dicts = DICT.filter(d => hit(d.cat) || hit(d.light) || hit(d.bg) || hit(d.angle) || hitTags(d.tags));
  return {articles, sections, dicts};
}
function byTag(tag){
  const has = tags => (tags||[]).includes(tag);
  return {
    articles: ARTICLES.filter(a=>has(a.tags)),
    sections: SECTIONS.filter(s=>has(s.tags)),
    dicts: DICT.filter(d=>has(d.tags)),
  };
}
function tagChips(tags){
  if(!tags || !tags.length) return "";
  return `<div class="tags-row">${tags.map(t=>`<a href="#/tag/${encodeURIComponent(t)}"><span class="tagchip tap">#${esc(t)}</span></a>`).join("")}</div>`;
}
function searchBox(){
  return `<form class="searchbox" id="searchform">
    <span class="ic">🔎</span>
    <input id="searchinput" type="search" placeholder="なにを撮る?で検索(例:キッチン)" autocomplete="off">
  </form>`;
}
function bindSearchBox(){
  const f = document.getElementById("searchform");
  if(!f) return;
  f.onsubmit = e => {
    e.preventDefault();
    const v = document.getElementById("searchinput").value.trim();
    if(v) location.hash = `#/search/${encodeURIComponent(v)}`;
  };
}

/* ================= ルーティング ================= */
const app = document.getElementById("app");
let pvTimer = null;
function route(){
  if(pvTimer){ clearInterval(pvTimer); pvTimer = null; }
  const h = location.hash.replace(/^#\/?/, "");
  const [p, arg] = h.split("/");
  window.scrollTo(0,0);
  if(p==="textbook") renderTextbook();
  else if(p==="article") renderArticle(arg);
  else if(p==="dict") arg ? renderDictDetail(arg) : renderDict();
  else if(p==="guide") renderGuide();
  else if(p==="preview") renderPreview(arg);
  else if(p==="cuts") renderCuts(arg);
  else if(p==="search") renderSearch(decodeURIComponent(arg||""));
  else if(p==="tag") renderTag(decodeURIComponent(arg||""));
  else renderHome();
  bindSearchBox();
}
window.addEventListener("hashchange", route);

const esc = s => s.replace(/</g,"&lt;");
const back = (href, label) => `<a class="back tap" href="${href}">← ${label}</a>`;

/* ================= 各ページ ================= */
function renderHome(){
  app.innerHTML = `<div class="page">
    <div class="home-header">
      <div class="txt">
        <div class="sub">しゅり直伝</div>
        <h1>暮らしの「撮り方」</h1>
      </div>
      <img class="avatar" src="assets/img/app_icon.png" alt="しゅり">
    </div>
    ${searchBox()}
    ${pillar("#/textbook","📖","暮らしを撮る教科書","撮り方のコツを学ぶ","rgba(143,176,196,.5)")}
    ${pillar("#/dict","🔎","撮り方逆引き辞典","なにを撮る？から調べる","rgba(228,164,172,.5)")}
    ${pillar("#/guide","🎬","撮影カットガイド","カットごとの撮り方を見る","rgba(169,196,138,.55)")}
  </div>`;
}
function pillar(href, emoji, title, sub, color){
  return `<a href="${href}"><div class="card tap row">
    <div class="icon-circle" style="background:${color}">${emoji}</div>
    <div class="grow"><div style="font-weight:900;font-size:17px">${title}</div>
    <div class="small">${sub}</div></div>
    <div class="chev">›</div>
  </div></a>`;
}

function renderTextbook(){
  app.innerHTML = `<div class="page">
    ${back("#/","トップ")}
    <span class="pill" style="background:rgba(143,176,196,.4)">教科書</span>
    <h2 style="font-size:24px;margin:6px 0 16px">暮らしを撮る教科書</h2>
    ${searchBox()}
    <div class="notebook">
      ${ARTICLES.map((a,i)=>`<a href="#/article/${a.id}"><div class="note-row tap">
        <div class="lesson-num">${i+1}</div>
        <div class="grow"><div style="font-weight:900;font-size:15px">${esc(a.title)}</div>
        <div class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.body.split("\n")[0])}</div></div>
        <div class="chev">›</div></div></a>`).join("")}
    </div>
  </div>`;
}

function renderArticle(id){
  const idx = ARTICLES.findIndex(x=>x.id===id); if(idx<0) return renderTextbook();
  const a = ARTICLES[idx], prev = ARTICLES[idx-1], next = ARTICLES[idx+1];
  app.innerHTML = `<div class="page">
    ${back("#/textbook","教科書")}
    <div class="article-title">
      <img src="assets/img/shuri_happy.png" alt="">
      <div><span class="pill" style="background:rgba(143,176,196,.4)">しゅり直伝</span>
      <span class="pill" style="background:rgba(74,63,53,.08)">${idx+1} / ${ARTICLES.length}</span>
      <h2 style="font-size:21px;margin-top:4px">${idx+1}. ${esc(a.title)}</h2></div>
    </div>
    <div class="notebook ruled">
      <span class="sashie-wrap"><img src="assets/img/note_${a.id}.png" alt="" onerror="this.parentNode.style.display='none'"></span>
      <div class="article-body">${esc(a.body)}</div>
    </div>
    <div class="pointcard">
      <img src="assets/img/shuri_point.png" alt="">
      <div><span class="plabel">POINT</span><p>${esc(a.point)}</p></div>
    </div>
    ${tagChips(a.tags)}
    <div class="pagenav-row">
      ${prev
        ? `<a class="pagenav tap" href="#/article/${prev.id}"><span class="dir">← 前のページ</span><span class="t">${idx}. ${esc(prev.title)}</span></a>`
        : `<div class="pagenav ghost"></div>`}
      ${next
        ? `<a class="pagenav tap" href="#/article/${next.id}" style="text-align:right"><span class="dir">次のページ →</span><span class="t">${idx+2}. ${esc(next.title)}</span></a>`
        : `<div class="pagenav ghost"></div>`}
    </div>
  </div>`;
}

function renderDict(){
  app.innerHTML = `<div class="page">
    ${back("#/","トップ")}
    <span class="pill" style="background:rgba(228,164,172,.45)">逆引き</span>
    <h2 style="font-size:24px;margin:6px 0 16px">撮り方逆引き辞典</h2>
    ${searchBox()}
    ${DICT.map(d=>`<a href="#/dict/${d.id}"><div class="card tap row">
      <div class="grow" style="font-weight:900;font-size:15px">${d.cat}</div>
      <div class="chev">›</div></div></a>`).join("")}
  </div>`;
}

function renderDictDetail(id){
  const d = DICT.find(x=>x.id===id); if(!d) return renderDict();
  app.innerHTML = `<div class="page">
    ${back("#/dict","逆引き辞典")}
    <h2 style="font-size:22px;margin-bottom:14px">${d.cat}</h2>
    <div class="card">
      <div class="tiprow"><div class="ic">☀️</div><div><div class="lbl">光</div><div class="val">${d.light}</div></div></div>
      <div class="tiprow"><div class="ic">🖼</div><div><div class="lbl">背景</div><div class="val">${d.bg}</div></div></div>
      <div class="tiprow"><div class="ic">📐</div><div><div class="lbl">角度</div><div class="val">${d.angle}</div></div></div>
    </div>
    <h3 style="font-size:16px;margin:16px 0 10px">おすすめの撮影構成</h3>
    ${d.rec.map(rid=>{const s=SECTIONS.find(x=>x.id===rid);return s ? `<a href="#/preview/${s.id}"><div class="card tap row">
      <div class="icon-circle" style="background:rgba(169,196,138,.45)">${s.emoji}</div>
      <div class="grow"><div style="font-weight:900;font-size:15px">${s.title}</div>
      <div class="small">${s.cuts.length}カット・${s.subtitle}</div></div>
      <div class="chev">›</div></div></a>` : "";}).join("")}
    ${tagChips(d.tags)}
  </div>`;
}

function renderGuide(){
  app.innerHTML = `<div class="page">
    ${back("#/","トップ")}
    <span class="pill" style="background:rgba(169,196,138,.5)">カットガイド</span>
    <h2 style="font-size:24px;margin:6px 0 4px">撮影カットガイド</h2>
    <p class="small" style="margin-bottom:16px">目的に合うセクションを選ぶと、カットごとの撮り方が見られます。カットを分けて撮るだけで、動画の見られ方は大きく変わります。</p>
    ${searchBox()}
    ${SECTIONS.map(s=>`<a href="#/preview/${s.id}"><div class="card tap row">
      <div class="icon-circle" style="background:rgba(169,196,138,.45)">${s.emoji}</div>
      <div class="grow"><div style="font-weight:900;font-size:16px">${s.title} ${s.sample?'<span class="pill" style="background:rgba(224,184,76,.45);font-size:10px">動画サンプル</span>':''}</div>
      <div class="small">${s.subtitle}・${s.cuts.length}カット</div></div>
      <div class="chev">›</div></div></a>`).join("")}
  </div>`;
}

/* ---- 完成イメージプレビュー ---- */
function renderPreview(id){
  const s = SECTIONS.find(x=>x.id===id); if(!s) return renderGuide();
  const N = s.cuts.length;
  const media = s.full
    ? `<video src="${s.full.src}" muted loop autoplay playsinline preload="auto"></video>`
    : `<img id="pvimg" src="${s.cuts[0].media.i}" alt="">`;
  app.innerHTML = `<div class="page">
    ${back("#/guide","セクション一覧")}
    <span class="pill" style="background:rgba(224,184,76,.45)">完成イメージ</span>
    <h2 style="font-size:22px;margin-top:6px">${s.title}</h2>
    <p class="small">${N}カットを繋ぐと、こんな流れの動画になります。</p>
    <div class="pv-media ${s.full?'v916':'v45'}">
      ${media}
      ${s.draftMedia ? `<span class="draft">実写サンプル準備中</span>` : ""}
      <div class="cutlabel" id="pvlabel">1. ${esc(s.cuts[0].title)}</div>
    </div>
    <div class="pv-dots" id="pvdots">${s.cuts.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join("")}</div>
    <a href="#/cuts/${s.id}"><button class="btn" style="margin-top:18px">撮影を始める</button></a>
    ${tagChips(s.tags)}
  </div>`;

  const label = document.getElementById("pvlabel");
  const dots = [...document.querySelectorAll("#pvdots span")];
  let cur = 0;
  const show = i => {
    if(i===cur) return;
    cur = i;
    label.textContent = `${i+1}. ${s.cuts[i].title}`;
    label.animate(
      [{transform:"translateX(-50%) scale(.82)",opacity:.4},{transform:"translateX(-50%) scale(1)",opacity:1}],
      {duration:160,easing:"ease-out"});
    dots.forEach((d,k)=>d.classList.toggle("on",k===i));
  };
  if(s.full){
    const v = document.querySelector(".pv-media video");
    v.addEventListener("timeupdate", ()=>{
      show(Math.min(N-1, Math.floor(v.currentTime / s.full.per)));
    });
  }else{
    const img = document.getElementById("pvimg");
    pvTimer = setInterval(()=>{
      const i = (cur+1) % N;
      img.src = s.cuts[i].media.i;
      show(i);
    }, 900);
  }
}

/* ---- カットビューア ---- */
function renderCuts(id){
  const s = SECTIONS.find(x=>x.id===id); if(!s) return renderGuide();
  const N = s.cuts.length;
  app.innerHTML = `<div class="page">
    ${back(`#/preview/${id}`,"完成イメージ")}
    <div class="viewer-head">
      <h2 style="font-size:20px">${s.title}</h2>
      <span class="pill" style="background:rgba(143,176,196,.4)" id="counter">CUT 1 / ${N}</span>
    </div>
    <div class="carousel" id="car">
      ${s.cuts.map((c,i)=>`<div class="slide" data-i="${i}">
        <div class="media">
          ${c.media.v
            ? `<video src="${c.media.v}" muted loop playsinline autoplay preload="auto"></video>
               <span class="loop">● ループ再生</span>`
            : `<img src="${c.media.i}" alt="">`}
          ${s.draftMedia ? `<span class="draft">実写サンプル準備中</span>` : ""}
          <span class="badge">CUT ${i+1}</span>
          ${i>0?'<span class="swipe-arrow left">‹</span>':''}
          ${i<N-1?'<span class="swipe-arrow right">›</span>':''}
        </div>
        <h3>${i+1}. ${esc(c.title)}</h3>
        <div class="angle">${esc(c.angle)}</div>
        <div class="tipbox">
          <img src="assets/img/shuri_point.png" alt="">
          <div><div class="label">POINT</div><p>${esc(c.tip)}</p></div>
        </div>
      </div>`).join("")}
    </div>
    <div class="nav">
      <button id="prev" aria-label="前へ">‹</button>
      <div class="dots" id="dots">${s.cuts.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join("")}</div>
      <button id="next" aria-label="次へ">›</button>
    </div>
    <p class="small" style="text-align:center;margin-top:10px">← スワイプでカットを進められます →</p>
    <div class="card" style="margin-top:14px">
      <div style="font-weight:900;font-size:14px;margin-bottom:6px">📷 撮り方のコツ</div>
      <ul class="small" style="padding-left:18px;display:grid;gap:4px">
        <li>次のカットは前の位置から<b>45度以上</b>動いて撮る（回り込む・高さを変える）</li>
        <li>各カットは少し長め（<b>10秒目安</b>）に回して、いいところだけ使う</li>
        <li>動作の<b>途中（7:3）</b>で次のカットへ切り替えると繋がって見える</li>
      </ul>
    </div>
    ${tagChips(s.tags)}
  </div>`;

  const car = document.getElementById("car");
  const dots = [...document.querySelectorAll("#dots span")];
  const counter = document.getElementById("counter");
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  let cur = 0;
  const update = i => {
    cur = Math.max(0, Math.min(N-1, i));
    dots.forEach((d,k)=>d.classList.toggle("on",k===cur));
    counter.textContent = `CUT ${cur+1} / ${N}`;
    prev.disabled = cur===0; next.disabled = cur===N-1;
    // 表示中の動画だけ再生（省電力）
    document.querySelectorAll("#car video").forEach((v,k)=>{ k===cur||!dots.length ? v.play().catch(()=>{}) : v.pause(); });
  };
  const goto = i => { car.scrollTo({left: i*car.clientWidth, behavior:"smooth"}); update(i); };
  prev.onclick = ()=>goto(cur-1);
  next.onclick = ()=>goto(cur+1);
  car.addEventListener("scroll", ()=>{
    const i = Math.round(car.scrollLeft / car.clientWidth);
    if(i!==cur) update(i);
  }, {passive:true});
  update(0);
}

/* ---- 検索結果 ---- */
function resultGroup(label, items, render){
  if(!items.length) return "";
  return `<div class="search-group">${label}（${items.length}）</div>${items.map(render).join("")}`;
}
function renderResultBlocks(r){
  const hasAny = r.articles.length || r.sections.length || r.dicts.length;
  if(!hasAny) return `<div class="search-empty">見つかりませんでした。<br>別のキーワードで試してみてください。</div>`;
  return [
    resultGroup("📖 教科書", r.articles, a=>`<a href="#/article/${a.id}"><div class="card tap row">
      <div class="grow"><div style="font-weight:900;font-size:15px">${esc(a.title)}</div>
      <div class="small">${esc(a.point)}</div></div><div class="chev">›</div></div></a>`),
    resultGroup("🎬 カットガイド", r.sections, s=>`<a href="#/preview/${s.id}"><div class="card tap row">
      <div class="icon-circle" style="background:rgba(169,196,138,.45)">${s.emoji}</div>
      <div class="grow"><div style="font-weight:900;font-size:15px">${esc(s.title)}</div>
      <div class="small">${s.cuts.length}カット・${esc(s.subtitle)}</div></div><div class="chev">›</div></div></a>`),
    resultGroup("🔎 逆引き", r.dicts, d=>`<a href="#/dict/${d.id}"><div class="card tap row">
      <div class="grow" style="font-weight:900;font-size:15px">${esc(d.cat)}</div>
      <div class="chev">›</div></div></a>`),
  ].join("");
}
function renderSearch(query){
  const r = searchAll(query);
  app.innerHTML = `<div class="page">
    ${back("#/","トップ")}
    <h2 style="font-size:22px;margin-bottom:14px">「${esc(query)}」の検索結果</h2>
    ${searchBox()}
    ${renderResultBlocks(r)}
  </div>`;
  const input = document.getElementById("searchinput");
  if(input) input.value = query;
}
function renderTag(tag){
  const r = byTag(tag);
  app.innerHTML = `<div class="page">
    ${back("#/","トップ")}
    <span class="pill" style="background:rgba(169,196,138,.5)">#タグ</span>
    <h2 style="font-size:22px;margin:6px 0 14px">#${esc(tag)} の撮り方</h2>
    ${renderResultBlocks(r)}
  </div>`;
}

const fbHeaders = {"apikey":FB_KEY, "Authorization":`Bearer ${FB_KEY}`, "Content-Type":"application/json"};
const fbKey = () => (location.hash.replace(/^#\/?/, "") || "home");

async function fbLoad(listEl, key){
  try{
    const r = await fetch(`${FB_URL}?page=eq.${encodeURIComponent(key)}&order=created_at.asc&select=id,body,created_at`, {headers:fbHeaders});
    if(!r.ok) throw 0;
    const rows = await r.json();
    listEl.innerHTML = rows.map(x=>{
      const d = new Date(x.created_at);
      return `<div class="fb-item" data-id="${x.id}">${esc(x.body)}
        <div class="fb-date">${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</div>
        <button class="fb-del" title="削除">✕</button></div>`;
    }).join("");
    listEl.querySelectorAll(".fb-del").forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm("このメモを削除しますか？")) return;
        await fetch(`${FB_URL}?id=eq.${b.parentElement.dataset.id}`, {method:"DELETE", headers:fbHeaders});
        fbLoad(listEl, key);
      };
    });
  }catch(e){ listEl.innerHTML = `<div class="fb-status">メモの読み込みに失敗しました（通信環境をご確認ください）</div>`; }
}

function mountFeedback(){
  const key = fbKey();
  const old = document.getElementById("fbcard"); if(old) old.remove();
  const page = app.querySelector(".page"); if(!page) return;
  const el = document.createElement("div");
  el.className = "fb-card"; el.id = "fbcard";
  el.innerHTML = `
    <div class="fb-head">💬 しゅりさんメモ</div>
    <div class="small">このページに直してほしいところがあれば、気軽に書いて送ってください（ページごとに保存されます）</div>

    <button class="fb-send" id="fb-send">メモを送る</button>
    <div class="fb-status" id="fb-status"></div>`;
  page.appendChild(el);
  const list = el.querySelector("#fb-list");
  fbLoad(list, key);
  el.querySelector("#fb-send").onclick = async ()=>{
    const ta = el.querySelector("#fb-text"), st = el.querySelector("#fb-status"), btn = el.querySelector("#fb-send");
    const body = ta.value.trim(); if(!body) return;
    btn.disabled = true; st.textContent = "送信中…";
    try{
      const r = await fetch(FB_URL, {method:"POST", headers:fbHeaders, body:JSON.stringify({page:key, body})});
      if(!r.ok) throw 0;
      ta.value = ""; st.textContent = "送信しました！";
      fbLoad(list, key);
      setTimeout(()=>{ st.textContent=""; }, 2500);
    }catch(e){ st.textContent = "送信に失敗しました。もう一度お試しください。"; }
    btn.disabled = false;
  };
}
